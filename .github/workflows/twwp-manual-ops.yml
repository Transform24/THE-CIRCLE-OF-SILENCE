name: TWWP Manual Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'seed-and-check'
        type: choice
        options:
          - seed-and-check
          - asset-check-only
      bearer_secret:
        description: 'RESTORE_ACCESS_SECRET bearer token'
        required: true
        type: string
      report_token:
        description: 'GitHub token to use for posting the report issue (falls back to GITHUB_TOKEN if blank)'
        required: false
        type: string

permissions:
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ inputs.bearer_secret }}"
          echo "::add-mask::${{ inputs.report_token }}"

      - name: Seed TWWP zip into KV (pull from GitHub into Cloudflare)
        if: ${{ inputs.action == 'seed-and-check' }}
        run: |
          echo "POST /twwp/seed" | tee -a /tmp/report.txt
          curl -sS -i -X POST "https://lively-dew-924c.tdwdemp.workers.dev/twwp/seed" \
            -H "Authorization: Bearer ${{ inputs.bearer_secret }}" \
            2>&1 | tee -a /tmp/report.txt

      - name: Check TWWP asset presence
        run: |
          echo "" | tee -a /tmp/report.txt
          echo "GET /twwp/asset-check" | tee -a /tmp/report.txt
          curl -sS -i "https://lively-dew-924c.tdwdemp.workers.dev/twwp/asset-check" 2>&1 | tee -a /tmp/report.txt

      - name: Post results as an issue comment (so logs are readable via the API)
        if: always()
        env:
          REPORT_TOKEN_INPUT: ${{ inputs.report_token }}
          DEFAULT_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/workflows/scripts/post_twwp_report.py